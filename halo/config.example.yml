# See https://ecli.app/docs/eclihalo
http:
  port: 80

https:
  port: 443


performance:
  worker_threads: 8
  accept_backlog: 65536
  accept_batch: 256
  cpu_affinity: true
  event_interval: 10
  global_queue_interval: 61
  thread_stack_size: 2097152

tls:
  mode: provided
  cert_path: /etc/ssl/certs/ecli.app/fullchain.pem
  key_path: /etc/ssl/private/ecli.app/privkey.pem
  # mode: lets_encrypt
  # acme_email: admin@ecli.app
  # acme_domains:
  #   - ecli.app
  #   - backend.ecli.app
  #   - cdn.ecli.app
  # acme_cache_dir: /var/lib/eclihalo/acme
  # acme_staging: false
  # mode: self_signed
  # hostname: dev.ecli.app

rate_limit:
  enabled: false
  # requests_per_sec: 500
  # burst: 1000
  # whitelist:
  #   - 10.0.0.
  #   - 172.16.

auto_update:
  enabled: false

routes:
  - domain: ecli.app
    strategy: least_connections
    websocket: true
    upstreams:
      - 127.0.0.1:3000
    upstream_timeout_secs: 60
    upstream_connect_timeout: 5
    upstream_read_timeout: 30
    max_body_bytes: 10485760
    header_rules:
      set_request:
        x-forwarded-proto: "https"
      remove_request:
        - cookie
      set_response:
        alt-svc: 'h3=":443"; ma=86400'
        strict-transport-security: "max-age=31536000; includeSubDomains; preload"
        x-content-type-options: "nosniff"
        x-frame-options: "SAMEORIGIN"
      remove_response:
        - server
        - x-powered-by
    rewrites:
      "^/api/v1/(.*)": "/api/v2/$1"
    proxy_cache:
      enabled: true
      ttl_secs: 30
      max_size_bytes: 104857600
    retry:
      tries: 2
      timeout_secs: 5
    # auth_request:
    #   url: http://127.0.0.1:4000/auth/verify
    #   timeout_secs: 5
    error_pages:
      502: /var/www/errors/502.html
      503: /var/www/errors/503.html
      404: /var/www/errors/404.html
    proxy_redirect:
      "http://127.0.0.1:3000": "https://ecli.app"
    sub_filter:
      "http://127.0.0.1:3000": "https://ecli.app"
    access_log: /var/log/eclihalo/ecli.app.access.log

  - domain: backend.ecli.app
    strategy: least_connections
    websocket: true
    upstream_timeout_secs: 60
    upstreams:
      - 127.0.0.1:4000
    header_rules:
      set_response:
        alt-svc: 'h3=":443"; ma=86400'
        cache-control: "no-store"
        access-control-allow-origin: "https://ecli.app"
        access-control-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
        access-control-allow-headers: "Authorization, Content-Type, X-Requested-With"
        access-control-allow-credentials: "true"
      remove_response: [server, x-powered-by]

  - domain: cdn.ecli.app
    strategy: round_robin
    static_files:
      root: /var/www/cdn
      index: index.html
      max_age: 31536000
      cache_strategy: smart
      cache_enabled: true
      precompressed: true
    tls:
       cert_path: /etc/ssl/certs/cdn.ecli.app/fullchain.pem
       key_path: /etc/ssl/private/cdn.ecli.app/privkey.pem
    header_rules:
      set_response:
        cache-control: "public, max-age=31536000, immutable"
        strict-transport-security: "max-age=31536000; includeSubDomains; preload"

  - domain: grpc.ecli.app
    grpc: true
    strategy: least_connections
    upstream_timeout_secs: 120
    upstreams:
      - 127.0.0.1:50051
    header_rules:
      set_response:
        alt-svc: 'h3=":443"; ma=86400'

  - domain: rtc.ecli.app
    strategy: round_robin
    webrtc:
      cors: true
      signalling_paths: [/offer, /answer, /ice]
    upstreams:
      - 127.0.0.1:9090
