<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{title}</title>
<style>
:root{--bg:#000;--fg:#e6e6e6;--dim:#666;--line:rgba(255,255,255,.05)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--fg);
  font:14px/1.7 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  display:flex;
  min-height:100vh;
  padding:14vh 8vw;
}
.wrap{max-width:640px}
.top{color:var(--dim);margin-bottom:2.5rem}
.top b{color:var(--fg);font-weight:600}
.code{color:var(--dim);font-size:13px}
h1{font-size:1.5rem;font-weight:600;margin:.2rem 0 1.2rem}
p{color:var(--dim);max-width:52ch}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b>EcliHalo</b> v{version}</div>
  <div class="code">{error}</div>
  <h1>{error_title}</h1>
  <p>{error_message}</p>
</div>
</body>
</html>
